name: Pinned Silex bounded publication checks

on:
  push:
    branches: [fix/publication-preparation-bounds-20261028]
    paths:
      - .github/workflows/silex-publication-bounds.yml
      - integration/silex-publication/**
      - upstream.lock.json
      - THIRD_PARTY_LICENSES.md
  workflow_dispatch:
    inputs:
      native_inventory:
        description: 'Read signed package metadata and simulate the native SDK install; no installation or build'
        type: boolean
        default: false
      native_followup:
        description: 'Explicit native prerequisite; no native GUI application execution'
        type: choice
        options: [none, bridge, verify-lock, sdk-admission, sdk-baseline, sdk-fetch, sdk-install, native-build, dashboard-unit, fs-identifier-rename, local-native-build, dashboard-compose-unit, dashboard-crud]
        default: none

permissions:
  contents: read

concurrency:
  group: silex-publication-bounds-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_CONFIG_SYSTEM: /dev/null
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_ALLOW_PROTOCOL: https
  GIT_TERMINAL_PROMPT: '0'
  GIT_ASKPASS: /usr/bin/false
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  native-inventory:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.native_inventory && inputs.native_followup == 'none' &&
      github.repository == 'VOLPAROSSA/volparossa-studio' &&
      github.ref == 'refs/heads/feature/native-bootstrap-privacy-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: studio
          persist-credentials: false
      - name: Bind the approved source and update only signed package metadata
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git -C studio rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
      - name: Record exact candidate hashes and the simulated dependency plan without installation
        run: python3 -B studio/integration/silex-native-bootstrap/inventory.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: silex-native-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/silex-native-inventory.json
          retention-days: 14
          if-no-files-found: warn

  native-bridge:
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.native_inventory && inputs.native_followup == 'bridge' &&
      github.repository == 'VOLPAROSSA/volparossa-studio' &&
      github.ref == 'refs/heads/feature/native-bootstrap-privacy-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: studio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: silexlabs/Silex
          ref: 672efed69dda04c0a1e968859239e042f00d9538
          path: silex
          persist-credentials: false
      - name: Bind exact source before source-only preparation
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git -C studio rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C silex rev-parse HEAD)" = 672efed69dda04c0a1e968859239e042f00d9538
      - name: Test source admission and owned caller cleanup without Node or native applications
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-native-bootstrap/test_prepare.py -v
          python3 -I -B studio/integration/silex-native-bootstrap/test_check_bridge.py -v
      - name: Apply the existing bounded publication patch and retain the pristine bridge
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-publication/prepare.py verify-baseline --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B studio/integration/silex-publication/prepare.py apply --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B - <<'PYTHON'
          import hashlib, os, pathlib, subprocess
          data = subprocess.check_output(['/usr/bin/git', '-C', os.environ['GITHUB_WORKSPACE'] + '/silex',
              'show', '672efed69dda04c0a1e968859239e042f00d9538:desktop/src-tauri/scripts/desktop-bridge.js'], timeout=20)
          assert len(data) <= 65536
          assert hashlib.sha256(data).hexdigest() == 'f91e9debbe5a67175ce93bdcd17c29b8b13ba1ae5616ffa450bea4d315d90fa3'
          with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'pristine-desktop-bridge.js').open('xb') as output:
              output.write(data)
          PYTHON
      - name: Apply and verify only the reviewed native bootstrap source overlay
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-native-bootstrap/prepare.py verify-baseline --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B studio/integration/silex-native-bootstrap/prepare.py apply --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B studio/integration/silex-native-bootstrap/prepare.py verify-patched --source "$GITHUB_WORKSPACE/silex"
      - name: Execute nine actual bridge contracts with the existing authenticated Node
        run: |
          python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/check_bridge.py" \
            --source "$GITHUB_WORKSPACE/silex" \
            --pristine-bridge "$RUNNER_TEMP/pristine-desktop-bridge.js"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: silex-native-bridge-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/silex-native-bridge.json
            ${{ runner.temp }}/silex-native-bridge.tap
          retention-days: 14
          if-no-files-found: warn

  native-lock:
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.native_inventory && inputs.native_followup == 'verify-lock' &&
      github.repository == 'VOLPAROSSA/volparossa-studio' &&
      github.ref == 'refs/heads/feature/native-bootstrap-privacy-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: studio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: silexlabs/Silex
          ref: 672efed69dda04c0a1e968859239e042f00d9538
          path: silex
          persist-credentials: false
      - name: Bind source and the existing authenticated compiler carrier
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git -C studio rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C silex rev-parse HEAD)" = 672efed69dda04c0a1e968859239e042f00d9538
          python3 -I -B - <<'PYTHON'
          import hashlib, os, pathlib
          root = pathlib.Path('studio/integration/silex-publication/toolchain')
          expected = {
            'provision-rust199.py': '73183c57744925c962cfb2bd7414ac2c20df8848ddad20e6240ba3257a2f8fcd',
            'rust199-components.json': '5cf2439e109e9fa92a25037130a20f903282e703ddb0ce192d7c06a8ec2737ba',
            'test-provision-rust199.py': '7683044d41b47a1cd3bc488368f63c15973e54b4154fe834696def2b4a3903f3',
          }
          for name, digest in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          for name in ('RUSTC', 'RUSTDOC', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'RUSTUP_TOOLCHAIN'):
              assert name not in os.environ
          PYTHON
      - name: Test the locked graph validator and authenticate only the reviewed compiler
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-native-bootstrap/test_verify_reviewed_lock.py -v
          python3 -I -B studio/integration/silex-publication/toolchain/test-provision-rust199.py -v
          python3 -I -B studio/integration/silex-publication/toolchain/provision-rust199.py runner
      - name: Prepare a fresh public-only Cargo home without inherited configuration
        run: |
          python3 -I -B - <<'PYTHON'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'silex-native-cargo-public-v1'
          root.mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CARGO_HOME=' + str(root) + '\n')
              output.write('CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse\n')
          PYTHON
      - name: Acquire only the exact base lock sources before removing native memberships
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-publication/prepare.py verify-baseline --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B studio/integration/silex-publication/prepare.py apply --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B - <<'PYTHON'
          import hashlib, pathlib, tomllib
          raw = pathlib.Path('silex/Cargo.lock').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '35d0ea429b62f5cd2bc8533f75f997c05e787ad3355a40c1de0eba5fd3233536'
          data = tomllib.loads(raw.decode())
          assert len(data['package']) == 607
          assert all(p.get('source') in (None, 'registry+https://github.com/rust-lang/crates.io-index') for p in data['package'])
          PYTHON
          python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/resolve_lock.py" --source "$GITHUB_WORKSPACE/silex" --fetch-base
      - name: Apply the exact reviewed six-path source and verify its lock offline
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-native-bootstrap/prepare.py verify-baseline --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B studio/integration/silex-native-bootstrap/prepare.py apply --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/verify_reviewed_lock.py" --source "$GITHUB_WORKSPACE/silex"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: silex-native-lock-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/silex-native-reviewed-lock.json
            ${{ runner.temp }}/silex-native-base-fetch.json
          retention-days: 14
          if-no-files-found: warn

  native-sdk-admission:
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.native_inventory && (inputs.native_followup == 'sdk-admission' || inputs.native_followup == 'sdk-baseline') &&
      github.repository == 'VOLPAROSSA/volparossa-studio' &&
      github.ref == 'refs/heads/feature/native-bootstrap-privacy-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: studio
          persist-credentials: false
      - name: Bind the exact source without package acquisition or installation
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git -C studio rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test shared SDK admission and cleanup boundaries
        run: python3 -I -B studio/integration/silex-native-bootstrap/test_install_sdk.py -v
      - name: Inspect only the unchanged privileged admission predicates
        if: inputs.native_followup == 'sdk-admission'
        run: python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/install_sdk.py" --admission-only
      - name: Inspect only the unchanged dpkg baseline query and parser
        if: inputs.native_followup == 'sdk-baseline'
        run: python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/install_sdk.py" --baseline-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: silex-native-${{ inputs.native_followup }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/silex-native-sdk-admission.json
            ${{ runner.temp }}/silex-native-sdk-admission-root.json
            ${{ runner.temp }}/silex-native-sdk-baseline.json
            ${{ runner.temp }}/silex-native-sdk-baseline-root.json
          retention-days: 14
          if-no-files-found: warn

  native-sdk-fetch:
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.native_inventory && (inputs.native_followup == 'sdk-fetch' || inputs.native_followup == 'sdk-install') &&
      github.repository == 'VOLPAROSSA/volparossa-studio' &&
      github.ref == 'refs/heads/feature/native-bootstrap-privacy-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: studio
          persist-credentials: false
      - name: Bind the exact source and update only signed public package metadata
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git -C studio rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
      - name: Test SDK manifest and archive boundaries without installation
        run: python3 -I -B studio/integration/silex-native-bootstrap/test_fetch_sdk.py -v
      - name: Test the exact offline SDK installation boundaries
        if: inputs.native_followup == 'sdk-install'
        run: python3 -I -B studio/integration/silex-native-bootstrap/test_install_sdk.py -v
      - name: Acquire and verify the exact SDK archives without extracting or executing them
        run: python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/fetch_sdk.py"
      - name: Install only the reviewed SDK closure offline on this disposable runner
        if: inputs.native_followup == 'sdk-install'
        run: python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/install_sdk.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: silex-native-${{ inputs.native_followup }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/silex-native-sdk-fetch.json
            ${{ runner.temp }}/silex-native-sdk-fetch-diagnostic.json
            ${{ runner.temp }}/silex-native-sdk-install.json
            ${{ runner.temp }}/silex-native-sdk-install-root.json
          retention-days: 14
          if-no-files-found: warn

  native-build:
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.native_inventory && inputs.native_followup == 'native-build' &&
      github.repository == 'VOLPAROSSA/volparossa-studio' &&
      github.ref == 'refs/heads/feature/native-bootstrap-privacy-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: studio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: silexlabs/Silex
          ref: 672efed69dda04c0a1e968859239e042f00d9538
          path: silex
          persist-credentials: false
      - name: Bind source and the existing authenticated compiler carrier
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git -C studio rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C silex rev-parse HEAD)" = 672efed69dda04c0a1e968859239e042f00d9538
          python3 -I -B - <<'PYTHON'
          import hashlib, os, pathlib
          root = pathlib.Path('studio/integration/silex-publication/toolchain')
          expected = {
            'provision-rust199.py': '73183c57744925c962cfb2bd7414ac2c20df8848ddad20e6240ba3257a2f8fcd',
            'rust199-components.json': '5cf2439e109e9fa92a25037130a20f903282e703ddb0ce192d7c06a8ec2737ba',
            'test-provision-rust199.py': '7683044d41b47a1cd3bc488368f63c15973e54b4154fe834696def2b4a3903f3',
          }
          for name, digest in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          for name in ('RUSTC', 'RUSTDOC', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER', 'RUSTUP_TOOLCHAIN'):
              assert name not in os.environ
          PYTHON
      - name: Test native source, compiler and build boundaries before provisioning
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-native-bootstrap/test_prepare.py -v
          python3 -I -B studio/integration/silex-native-bootstrap/test_native_build.py -v
          python3 -I -B studio/integration/silex-publication/toolchain/test-provision-rust199.py -v
          python3 -I -B studio/integration/silex-publication/toolchain/provision-rust199.py runner
      - name: Prepare a fresh public-only Cargo home without inherited configuration
        run: |
          python3 -I -B - <<'PYTHON'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'silex-native-cargo-public-v1'
          root.mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CARGO_HOME=' + str(root) + '\n')
              output.write('CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse\n')
          PYTHON
      - name: Acquire only the exact base lock sources before removing native memberships
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-publication/prepare.py verify-baseline --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B studio/integration/silex-publication/prepare.py apply --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B - <<'PYTHON'
          import hashlib, pathlib, tomllib
          raw = pathlib.Path('silex/Cargo.lock').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '35d0ea429b62f5cd2bc8533f75f997c05e787ad3355a40c1de0eba5fd3233536'
          data = tomllib.loads(raw.decode())
          assert len(data['package']) == 607
          assert all(p.get('source') in (None, 'registry+https://github.com/rust-lang/crates.io-index') for p in data['package'])
          PYTHON
          python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/resolve_lock.py" --source "$GITHUB_WORKSPACE/silex" --fetch-base
      - name: Apply the exact reviewed native overlay before SDK admission
        run: |
          set -euo pipefail
          python3 -I -B studio/integration/silex-native-bootstrap/prepare.py verify-baseline --source "$GITHUB_WORKSPACE/silex"
          python3 -I -B studio/integration/silex-native-bootstrap/prepare.py apply --source "$GITHUB_WORKSPACE/silex"
      - name: Bind the exact source and update only signed public package metadata
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(id -u)" != 0
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git -C studio rev-parse HEAD)" = "$GITHUB_SHA"
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
      - name: Test SDK manifest and archive boundaries without installation
        run: python3 -I -B studio/integration/silex-native-bootstrap/test_fetch_sdk.py -v
      - name: Test the exact offline SDK installation boundaries
        run: python3 -I -B studio/integration/silex-native-bootstrap/test_install_sdk.py -v
      - name: Acquire and verify the exact SDK archives without extracting or executing them
        run: python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/fetch_sdk.py"
      - name: Install only the reviewed SDK closure offline on this disposable runner
        run: python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/install_sdk.py"
      - name: Compile the private native release without starting or distributing it
        run: python3 -I -B "$GITHUB_WORKSPACE/studio/integration/silex-native-bootstrap/native_build.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: silex-native-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/silex-native-sdk-fetch.json
            ${{ runner.temp }}/silex-native-sdk-install.json
            ${{ runner.temp }}/silex-native-sdk-install-root.json
            ${{ runner.temp }}/silex-native-base-fetch.json
            ${{ runner.temp }}/silex-native-reviewed-lock.json
            ${{ runner.temp }}/silex-native-build.json
          retention-days: 14
          if-no-files-found: warn

  dashboard-compose-unit:
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.native_inventory && inputs.native_followup == 'dashboard-compose-unit' &&
      github.repository == 'VOLPAROSSA/volparossa-studio' &&
      github.ref == 'refs/heads/feature/native-local-dashboard-20261029'
    runs-on: ubuntu-24.04
