name: Studio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: source-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python syntax and inert contracts
        working-directory: integration/silex-export
        # test_contract parses every fixture Python source without running it.
        # The viewer writer cross-check and test_wrapper_guard require Core and
        # stay in the separate Core trial; remaining viewer contracts run here.
        run: python3 -B -m unittest -v test_contract test_lifecycle test_runtime_context test_viewer_receipt
      - name: Check viewer units with the existing authenticated Node
        working-directory: integration/silex-export
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import signal
          import tempfile
          import run as fixture
          if (os.environ.get('GITHUB_ACTIONS') != 'true'
                  or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted'
                  or os.environ.get('RUNNER_OS') != 'Linux'
                  or os.environ.get('RUNNER_ARCH') != 'X64'
                  or fixture.revision(fixture.FIXTURE.parents[1]) != os.environ['GITHUB_SHA']):
              raise RuntimeError('exact-source approved hosted runner required')
          def cancel(_signum, _frame):
              raise InterruptedError('cancelled')
          signal.signal(signal.SIGTERM, cancel)
          signal.signal(signal.SIGINT, cancel)
          with tempfile.TemporaryDirectory(prefix='studio-viewer-units-', dir=os.environ['RUNNER_TEMP']) as root:
              temporary = Path(root)
              node, _pnpm = fixture.prepare(temporary)
              env = {key: os.environ[key] for key in ('PATH', 'HOME', 'LANG', 'LC_ALL', 'RUNNER_TEMP')
                     if key in os.environ}
              fixture.run_viewer_units(node, fixture.FIXTURE, temporary, env, {})
          PY
