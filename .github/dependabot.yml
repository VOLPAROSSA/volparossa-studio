version: 2
updates:
  - package-ecosystem: npm
    directory: /integration/silex-export
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      volparossa-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      volparossa-security:
        applies-to: security-updates
        patterns:
          - "*"
